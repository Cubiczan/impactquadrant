<!doctype html><html><head><meta charset="utf-8"><title>Evidence review · ImpactQuadrant</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#e7eaf3}main{max-width:820px;margin:auto;padding:24px}section{background:#141d3a;border-radius:12px;padding:16px;margin:12px 0}h1{font-size:22px}h2{font-size:15px;color:#9fd1ff;margin:0 0 8px}pre{white-space:pre-wrap;background:#0f1730;padding:10px;border-radius:8px}label{display:block;margin:6px 0}textarea,input{width:100%;box-sizing:border-box;background:#0f1730;color:#e7eaf3;border:1px solid #22305a;border-radius:8px;padding:8px}button{background:#2b6cff;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;margin-top:10px}.muted{color:#9fb0d8;font-size:13px}
/* mobile: tables scroll inside their card, page never scrolls sideways */
html,body{max-width:100%;overflow-x:hidden}section{min-width:0;overflow-wrap:anywhere}main{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
@media (max-width:600px){header{padding:16px}main{padding:12px;gap:12px}section{padding:12px}table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;white-space:nowrap}td,th{white-space:normal;min-width:90px}}</style></head>
<body><main><h1>Evidence review <span class="muted" id="kind"></span></h1>
<p class="muted">You are reviewing a consented identity-and-intent call that ImpactQuadrant ran. Evidence is redacted. Do not try to contact or identify the person. You are paid after we review and approve your verdict.</p>
<div id="app">Loading…</div></main>
<script>
const P=new URLSearchParams(location.search),c=P.get('c'),t=P.get('t'),sid=P.get('teracSubmissionId')||P.get('submissionId')||'',task=P.get('taskId')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
fetch(`/api/review?c=${encodeURIComponent(c||'')}&t=${encodeURIComponent(t||'')}`).then(r=>r.json()).then(d=>{
 if(!d.bundle){app.textContent=d.error||'Link not valid.';return}
 const b=d.bundle;kind.textContent='· '+'Owner verification';
 const ctx=Object.entries(b.context||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(typeof v==='object'?JSON.stringify(v):v)}</td></tr>`).join('');
 app.innerHTML=`<section><h2>Consent</h2><p>Consent given (${esc(b.consent.method)}, ${esc(b.consent.at)}). Recording allowed: ${b.consent.recording_allowed?'yes':'no (notes only)'}.</p></section>
 <section><h2>Context (redacted)</h2><table>${ctx||'<tr><td>None</td></tr>'}</table></section>
 <section><h2>Call notes</h2><pre>${esc(b.notes)}</pre>${b.transcript?`<h2>Transcript (redacted)</h2><pre>${esc(b.transcript)}</pre>`:''}${b.recording?`<p class="muted">${esc(b.recording)}</p>`:''}</section>
 <section><h2>Assess</h2><ol>${b.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>
 <form id="f"><label><input type="radio" name="verdict" value="verified" required style="width:auto"> Verified: consistent, no concerns</label>
 <label><input type="radio" name="verdict" value="concerns" style="width:auto"> Concerns: needs follow-up</label>
 <label><input type="radio" name="verdict" value="fail" style="width:auto"> Fail: identity or intent not credible</label>
 <label>Reasons (cite the evidence, answer each question)<textarea name="reasons" rows="7" required minlength="20"></textarea></label>
 <label>Your Terac name or ID (optional)<input name="reviewer"></label><button>Submit verdict</button> <span id="msg"></span></form></section>`;
 f.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));
  fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c,t,...x,submissionId:sid})}).then(r=>r.json()).then(r=>{
   if(!r.ok){msg.textContent='Error: '+r.error;return}
   app.innerHTML='<section><h2>Thank you</h2><p>Your verdict is stored. ImpactQuadrant reviews it before Terac releases payment.</p></section>';
   if(sid){const u=new URL('https://terac.com/api/external/callback');u.searchParams.set('submissionId',sid);u.searchParams.set('teracSubmissionId',sid);if(task)u.searchParams.set('taskId',task);u.searchParams.set('result','completed');setTimeout(()=>location.href=u,1500)}
  })}
}).catch(()=>app.textContent='Could not load.');
</script></body></html>
