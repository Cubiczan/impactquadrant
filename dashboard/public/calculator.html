<!doctype html><html><head><meta charset="utf-8"><title>Free valuation & deal calculator · Impact Quadrant</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}label{display:block;margin:10px 0}input{width:100%;padding:6px}#out{background:#f2f5fb;padding:12px;border-radius:8px}</style></head><body>
<h1>Free valuation & deal calculator</h1><p>Business brokerage, reimagined and automated. All outputs are <b>estimates</b>; your inputs, your assumptions. Confirm financing terms with your lender.</p>
<label>Earnings basis <select id="b"><option>SDE</option><option>EBITDA</option></select></label>
<label>Annual earnings ($)<input id="e" type="number" value="600000"></label>
<label>Multiple low / high <input id="ml" type="number" step="0.1" value="2.0"><input id="mh" type="number" step="0.1" value="3.1"></label>
<label>Your down payment / equity injection (%)<input id="d" type="number" value="10"></label>
<div id="out"></div>
<script>const f=x=>'$'+Math.round(x).toLocaleString();function u(){const e=+document.getElementById('e').value,l=+ml.value,h=+mh.value,d=+document.getElementById('d').value/100;
out.innerHTML=`Value range (estimate, ${b.value} basis): <b>${f(e*l)} – ${f(e*h)}</b><br>Your equity at ${d*100}%: ${f(e*l*d)} – ${f(e*h*d)}<br><small>Typical bands we use: SDE 2.0–3.1x for owner-operated businesses; EBITDA 4.0–5.8x for larger ones. Never apply an EBITDA multiple to SDE.</small>`}
document.querySelectorAll('input,select').forEach(i=>i.oninput=u);u();</script></body></html>
